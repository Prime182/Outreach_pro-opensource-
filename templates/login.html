<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}"> <!-- Your custom styles if any -->
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-md rounded-lg px-8 pt-6 pb-8 mb-4 w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-900 text-center mb-6">Login</h1>
        <form action="/login" method="post" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                <div class="mt-1">
                    <input type="email" id="email" name="email" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1">
                    <input type="password" id="password" name="password" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>
            
            <div>
                <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Sign in
                </button>
            </div>
        </form>
        <p id="error-message" class="text-red-500 text-sm mt-4 text-center"></p>
        <!-- Link to registration page removed -->
        <!-- <p>Don't have an account? <a href="/register">Register here</a></p> -->
    </div>
    <script>
        const form = document.querySelector('form');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.textContent = '';

            const formData = new FormData(form);
            const response = await fetch('/login', {
                method: 'POST',
                body: formData
                // Default redirect behavior is 'follow', which is what we want.
            });

            if (response.ok) {
                // response.ok is true if the status is 200-299.
                // If login was successful, the server sends a 302 redirect.
                // Fetch, by default, follows this redirect.
                // The 'response' object here will be for the *final* URL after the redirect (e.g., '/').
                // response.redirected will be true.
                if (response.redirected) {
                    // The browser's current URL might not have updated yet due to event.preventDefault().
                    // Explicitly navigate to the URL the server redirected to.
                    window.location.assign(response.url); 
                } else {
                    // This case is unexpected for a successful login via POST to /login,
                    // as it should redirect. If /login itself sent a 200 OK with JSON
                    // (which it doesn't in our current main.py for success), handle it here.
                    // For robustness, we can try to parse JSON and act, or just redirect.
                    window.location.assign('/'); // Fallback redirect to home
                }
            } else {
                // response.ok is false (e.g., status 401, 500).
                // This means login failed or another error occurred.
                // The server should send a JSON error message.
                try {
                    const errorData = await response.json();
                    errorMessage.textContent = errorData.detail || 'Login failed. Please try again.';
                } catch (e) {
                    errorMessage.textContent = 'Login failed. An unexpected error occurred while parsing the error response.';
                }
            }
        });
    </script>
</body>
</html>
