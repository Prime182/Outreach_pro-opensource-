version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb+srv://fastapi_user:1234@cluster0.kaxpb.mongodb.net/
      - SECRET_KEY=your_secret_key_for_session_management_change_this_in_production
      - PUBLIC_BASE_URL=http://0.0.0.0:8000/
    volumes:
      - .:/app
    restart: unless-stopped

# Local MongoDB container removed since we're using MongoDB Atlas 